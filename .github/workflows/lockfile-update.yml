---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCascorWorker
# Application:   juniper_cascor_worker
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-05-02
# Last Modified: 2026-07-28
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically updates BOTH lockfiles when Dependabot pushes a dependency
#    update to a dependabot/pip/** branch. Runs uv pip compile to regenerate
#    requirements.lock, re-derives requirements-cpu.lock from it, and commits the
#    pair in ONE GitHub-signed commit so downstream Docker / CI builds stay in
#    sync with the bumped dependency's transitive pins.
#
#    Two locks, because the container image is CPU-only: requirements.lock was
#    resolved against the CUDA torch and pins the whole nvidia-*/triton stack
#    outright, so the image installs requirements-cpu.lock instead -- the same lock
#    minus that stack, derived with --constraint requirements.lock. Regenerating
#    only the GPU lock (what this workflow did until 2026-09-09) drifts the CPU
#    lock, and the CI lock checks are name-presence only, so nothing goes red. The
#    two had already diverged on 10 of their 19 shared pins.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the commit re-triggers CI.
#
#    Dependabot caveat (2026-07-28): Dependabot-triggered runs use the
#    Dependabot secret store, so the repo-scoped CROSS_REPO_DISPATCH_TOKEN is
#    EMPTY there and the checkout hard-fails on every dependabot/pip/** push.
#    The token-availability gate below turns that arm into a loud green no-op
#    until the owner registers the same PAT under Settings -> Secrets ->
#    Dependabot. Mirrors juniper-canopy #476 / juniper-cascor #428 /
#    juniper-data #246.
#    See juniper-ml/notes/JUNIPER_2026-05-02_JUNIPER-ECOSYSTEM_V17-V18-CROSS-REPO-DISPATCH-TOKEN-SETUP.md
#    for the secret-provisioning walkthrough.
#
#    The GPU lockfile was compiled with:
#       uv pip compile pyproject.toml --no-emit-package torch -o requirements.lock
#    This workflow preserves that invocation so the regeneration is
#    bit-for-bit consistent with the existing lockfile header. The CPU lock's own
#    recipe lives in requirements-cpu.lock's header and is mirrored by the step
#    below; the torch pin it needs is read from the Dockerfile's ARG TORCH_VERSION
#    rather than restated here, so there is one source of truth for it.
#####################################################################################################################################################################################################

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    # Run for:
    #   - any push to a dependabot/pip/** branch (the original trigger), AND
    #   - pull_request events from this repo's own branches (covers
    #     manual pyproject.toml edits — e.g. min-version bumps that
    #     leave main red after merge). Skip PRs from forks since they
    #     cannot push back with our token.
    # Replicates juniper-canopy PR #250 / juniper-data PR #122 hardening.
    if: |
      (github.event_name == 'push' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Gate on CROSS_REPO_DISPATCH_TOKEN availability
        id: gate
        env:
          # Secrets are not readable in job/step `if:` expressions, so surface
          # presence (never the value) through env for the shell to branch on.
          HAVE_PAT: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          if [[ "${HAVE_PAT}" == "true" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "::notice::CROSS_REPO_DISPATCH_TOKEN is not available to Dependabot-triggered runs (Dependabot secret store). Skipping auto-regen; the Lockfile Freshness CI gate still enforces staleness. Register the PAT under Settings -> Secrets -> Dependabot to re-enable."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is missing for a non-Dependabot run — secret misconfiguration."
            exit 1
          fi

      - name: Checkout Code
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          # For pull_request events, check out the PR head branch (not the
          # merge ref) so the regen commit can be pushed back. ${{ github.ref }}
          # remains correct for push events on dependabot/pip/**.
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.gate.outputs.proceed == 'true'
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor Worker - Regenerate Lockfile          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # --upgrade is required because uv pip compile reads the existing -o
          # file as pins by default and won't bump transitive deps without it.
          # --no-emit-package torch matches the existing lockfile header — torch
          # is installed separately (see CI install steps) so we deliberately
          # omit it from the compiled pin set.
          uv pip compile pyproject.toml \
            --no-emit-package torch \
            --upgrade \
            -o requirements.lock

      # ``requirements-cpu.lock`` (the CONTAINER image's lock) is DERIVED from
      # requirements.lock via ``--constraint``, so regenerating the GPU lock alone drifts
      # it. That is not hypothetical: this repo's two locks had diverged on 10 of their 19
      # shared pins by 2026-09-09 (setuptools 70.2.0 vs 83.0.0, numpy 2.4.4 vs 2.5.1, ...)
      # precisely because this step regenerated one of them, and the CI lock checks are
      # name-presence only so nothing went red. Re-derive it here, in the same run, and
      # commit BOTH files in the SAME commit below.
      #
      # This step runs AFTER the GPU regen above on purpose: --constraint reads the lock
      # that step just rewrote.
      - name: Regenerate requirements-cpu.lock (derived from the GPU lock)
        if: steps.gate.outputs.proceed == 'true'
        run: |
          set -euo pipefail

          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor Worker - Regenerate CPU Lockfile      ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # The torch pin lives in the Dockerfile (ARG TORCH_VERSION) and is mirrored in
          # the CPU lock header's recipe; tests/test_dockerfile_cpu_torch_pin.py asserts the
          # two agree. Read the operative one and REFUSE if the header disagrees, rather
          # than regenerating against a stale pin and restoring a header that contradicts it.
          TORCH_VERSION="$(sed -n 's/^ARG TORCH_VERSION=//p' Dockerfile)"
          HEADER_VERSION="$(sed -n 's/.*torch==\([0-9][0-9.]*\)+cpu.*/\1/p' requirements-cpu.lock | head -1)"
          if [ -z "${TORCH_VERSION}" ] || [ "${TORCH_VERSION}" != "${HEADER_VERSION}" ]; then
            echo "::error::torch pin mismatch — Dockerfile ARG TORCH_VERSION='${TORCH_VERSION}', requirements-cpu.lock header='${HEADER_VERSION}'. Bump both together, then re-run."
            exit 1
          fi
          echo "torch==${TORCH_VERSION}+cpu" > /tmp/torch-cpu-override

          # Preserve the hand-written header: uv replaces it with its own command line.
          # The header is every leading line before the first pin (the first line starting
          # with neither whitespace nor '#').
          awk '/^[^[:space:]#]/{exit} {print}' requirements-cpu.lock > /tmp/cpu-lock-header
          if [ ! -s /tmp/cpu-lock-header ]; then
            echo "::error::requirements-cpu.lock has no leading comment header — refusing to regenerate and lose the recipe."
            exit 1
          fi

          # Compiled to a fresh path, not in place: uv reads an existing -o file as extra
          # constraints, which would silently freeze the bump. (The GPU step above solves the
          # same trap with --upgrade; here --constraint already supplies the pins, so a fresh
          # path is the honest form.)
          uv pip compile pyproject.toml \
            --index-strategy unsafe-best-match \
            --extra-index-url https://download.pytorch.org/whl/cpu \
            --no-emit-package torch \
            --override /tmp/torch-cpu-override \
            --constraint requirements.lock \
            --python-version 3.14 \
            -o /tmp/requirements-cpu.lock.check

          # Everything from the first pin on, dropping uv's own autogenerated header.
          awk 'f || /^[^[:space:]#]/{f = 1; print}' /tmp/requirements-cpu.lock.check > /tmp/cpu-lock-body
          cat /tmp/cpu-lock-header /tmp/cpu-lock-body > requirements-cpu.lock

      # The regen commit is created through the GitHub API rather than by a local
      # `git commit` + `git push`, because GitHub SIGNS API-created commits and this repo
      # enforces required_signatures on the default branch (juniper-ml#1099). The ruleset is
      # ~DEFAULT_BRANCH-scoped, so the old plain push to dependabot/pip/** SUCCEEDED — and
      # then left an unsigned commit in the branch's history, which blocks the merge that
      # push exists to enable. juniper-data, juniper-canopy and juniper-cascor were converted
      # earlier; this repo was not. CROSS_REPO_DISPATCH_TOKEN stays the identity so the
      # resulting commit still re-triggers CI (GITHUB_TOKEN would not).
      - name: Commit updated lockfiles (GitHub-signed, via API)
        if: steps.gate.outputs.proceed == 'true'
        env:
          GH_TOKEN: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          set -euo pipefail

          if git diff --quiet -- requirements.lock requirements-cpu.lock; then
            echo "::notice::Lockfiles already up to date — no commit needed"
            exit 0
          fi

          # Both locks go in ONE commit even when only one changed: they are a derived pair,
          # and landing them separately is the drift this step exists to prevent.
          # createCommitOnBranch takes each file's full contents, so an unchanged file is
          # simply rewritten identically — a no-op in the resulting tree.
          git diff --quiet -- requirements.lock \
            && echo "::notice::requirements.lock unchanged" \
            || echo "::notice::requirements.lock updated"
          git diff --quiet -- requirements-cpu.lock \
            && echo "::notice::requirements-cpu.lock unchanged" \
            || echo "::notice::requirements-cpu.lock updated"

          # expectedHeadOid makes this a compare-and-swap: if anything landed on the branch
          # since checkout, the mutation fails loudly rather than clobbering it (the old
          # `git push` had the same protection).
          HEAD_OID=$(git rev-parse HEAD)

          jq -n \
            --arg repo "${GITHUB_REPOSITORY}" \
            --arg branch "${BRANCH}" \
            --arg oid "${HEAD_OID}" \
            --arg contents "$(base64 -w0 requirements.lock)" \
            --arg cpu_contents "$(base64 -w0 requirements-cpu.lock)" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                message: {headline: "[dependabot skip] Update requirements.lock and requirements-cpu.lock"},
                expectedHeadOid: $oid,
                fileChanges: {additions: [{path: "requirements.lock", contents: $contents},
                                          {path: "requirements-cpu.lock", contents: $cpu_contents}]}
              }}}' > /tmp/lockfile-commit.json

          gh api graphql --input /tmp/lockfile-commit.json > /tmp/lockfile-commit-result.json

          if jq -e '.errors' /tmp/lockfile-commit-result.json > /dev/null; then
            echo "::error::createCommitOnBranch failed — lockfiles NOT committed:"
            jq '.errors' /tmp/lockfile-commit-result.json
            exit 1
          fi

          jq -r '"Signed lockfile commit: " + .data.createCommitOnBranch.commit.url' \
            /tmp/lockfile-commit-result.json
