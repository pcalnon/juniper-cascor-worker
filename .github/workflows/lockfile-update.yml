---
#####################################################################################################################################################################################################
# Project:       Juniper
# Sub-Project:   JuniperCascorWorker
# Application:   juniper_cascor_worker
# File Name:     lockfile-update.yml
# Author:        Paul Calnon
# Version:       0.1.0
#
# Date Created:  2026-05-02
# Last Modified: 2026-07-28
#
# License:       MIT License
# Copyright:     Copyright (c) 2024-2026 Paul Calnon
#
# Description:
#    Automatically updates requirements.lock when Dependabot pushes a dependency
#    update to a dependabot/pip/** branch. Runs uv pip compile to regenerate
#    the lockfile and commits the result so downstream Docker / CI builds
#    stay in sync with the bumped dependency's transitive pins.
#
#    Uses CROSS_REPO_DISPATCH_TOKEN (not GITHUB_TOKEN) so the push re-triggers CI.
#
#    Dependabot caveat (2026-07-28): Dependabot-triggered runs use the
#    Dependabot secret store, so the repo-scoped CROSS_REPO_DISPATCH_TOKEN is
#    EMPTY there and the checkout hard-fails on every dependabot/pip/** push.
#    The token-availability gate below turns that arm into a loud green no-op
#    until the owner registers the same PAT under Settings -> Secrets ->
#    Dependabot. Mirrors juniper-canopy #476 / juniper-cascor #428 /
#    juniper-data #246.
#    See juniper-ml/notes/JUNIPER_2026-05-02_JUNIPER-ECOSYSTEM_V17-V18-CROSS-REPO-DISPATCH-TOKEN-SETUP.md
#    for the secret-provisioning walkthrough.
#
#    The previous lockfile was compiled with:
#       uv pip compile pyproject.toml --no-emit-package torch -o requirements.lock
#    This workflow preserves that invocation so the regeneration is
#    bit-for-bit consistent with the existing lockfile header.
#####################################################################################################################################################################################################

name: Update Lockfile (Dependabot)

on:
  push:
    branches:
      - dependabot/pip/**
  pull_request:
    paths:
      - pyproject.toml

permissions:
  contents: write

jobs:
  update-lockfile:
    name: Update requirements.lock
    runs-on: ubuntu-latest
    # Run for:
    #   - any push to a dependabot/pip/** branch (the original trigger), AND
    #   - pull_request events from this repo's own branches (covers
    #     manual pyproject.toml edits — e.g. min-version bumps that
    #     leave main red after merge). Skip PRs from forks since they
    #     cannot push back with our token.
    # Replicates juniper-canopy PR #250 / juniper-data PR #122 hardening.
    if: |
      (github.event_name == 'push' && github.actor == 'dependabot[bot]') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)

    steps:
      - name: Gate on CROSS_REPO_DISPATCH_TOKEN availability
        id: gate
        env:
          # Secrets are not readable in job/step `if:` expressions, so surface
          # presence (never the value) through env for the shell to branch on.
          HAVE_PAT: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN != '' }}
        run: |
          if [[ "${HAVE_PAT}" == "true" ]]; then
            echo "proceed=true" >> "${GITHUB_OUTPUT}"
          elif [[ "${{ github.actor }}" == "dependabot[bot]" ]]; then
            echo "::notice::CROSS_REPO_DISPATCH_TOKEN is not available to Dependabot-triggered runs (Dependabot secret store). Skipping auto-regen; the Lockfile Freshness CI gate still enforces staleness. Register the PAT under Settings -> Secrets -> Dependabot to re-enable."
            echo "proceed=false" >> "${GITHUB_OUTPUT}"
          else
            echo "::error::CROSS_REPO_DISPATCH_TOKEN is missing for a non-Dependabot run — secret misconfiguration."
            exit 1
          fi

      - name: Checkout Code
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          token: ${{ secrets.CROSS_REPO_DISPATCH_TOKEN }}
          # For pull_request events, check out the PR head branch (not the
          # merge ref) so the regen commit can be pushed back. ${{ github.ref }}
          # remains correct for push events on dependabot/pip/**.
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Python
        if: steps.gate.outputs.proceed == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"

      - name: Install uv
        if: steps.gate.outputs.proceed == 'true'
        run: pip install uv==0.11.8

      - name: Regenerate requirements.lock
        if: steps.gate.outputs.proceed == 'true'
        run: |
          echo "╔════════════════════════════════════════════════════════════╗"
          echo "║       Juniper Cascor Worker - Regenerate Lockfile          ║"
          echo "╚════════════════════════════════════════════════════════════╝"

          # --upgrade is required because uv pip compile reads the existing -o
          # file as pins by default and won't bump transitive deps without it.
          # --no-emit-package torch matches the existing lockfile header — torch
          # is installed separately (see CI install steps) so we deliberately
          # omit it from the compiled pin set.
          uv pip compile pyproject.toml \
            --no-emit-package torch \
            --upgrade \
            -o requirements.lock

      - name: Commit updated lockfile
        if: steps.gate.outputs.proceed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requirements.lock
          if git diff --cached --quiet; then
            echo "::notice::Lockfile already up to date — no commit needed"
          else
            git commit -m "[dependabot skip] Update requirements.lock"
            git push
          fi
