---
#####################################################################################################################################################################################################
# Project:       Juniper
# File Name:     scheduled-tests.yml (template)
#
# Description:
#    Canonical "slow / nightly" tests workflow. Drop into a target repo's
#    `.github/workflows/scheduled-tests.yml`. Two TODOs to customize per
#    repo:
#      1. PYTHON_TEST_VERSION — match the repo's preferred test Python
#         (3.12 for most; 3.11 for juniper-cascor-client; 3.14 for
#         juniper-cascor's existing workflow).
#      2. The `pytest -m` selector — repos with `slow` markers should
#         use `slow or integration`; repos without should use just
#         `integration`.
#
#    juniper-cascor already ships a richer scheduled-tests.yml (slow
#    unit + slow integration + long-running + benchmarks). That richer
#    flavor is *not* generalized in this template — keep it as
#    juniper-cascor's local override.
#####################################################################################################################################################################################################

name: Scheduled Tests

on:
  schedule:
    - cron: '0 6 * * *'  # daily at 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_TEST_VERSION: "3.12"

jobs:
  slow-or-integration-tests:
    # The name spells out the suffix GitHub appended to the old static name ("Slow / Integration
    # Tests (3.14)"), so the three existing legs post the same names as before, and the 3.15 leg is
    # "(3.15)" rather than "(3.15, true)".
    name: Slow / Integration Tests (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration, 2026-11-14): its leg reports, but a
    # failure there fails neither the job nor the run. Same pattern as ci.yml's unit-tests job.
    continue-on-error: ${{ matrix.experimental == true }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
        include:
          - python-version: "3.15"
            experimental: true
    steps:
      - name: Checkout Code
        id: checkout-code
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 1

      - name: Set up Python ${{ matrix.python-version }}
        id: set-up-python
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        id: install-dependencies
        continue-on-error: ${{ matrix.experimental == true }}
        run: |
          python -m pip install --upgrade "pip>=26.1.1"
          pip install -e ".[test]" || pip install -e ".[dev]" || pip install -e .

      - name: Run slow / integration tests
        id: run-slow-integration-tests
        continue-on-error: ${{ matrix.experimental == true }}
        # The selector is ``integration`` alone, as the template's TODO 2
        # says for a repo without ``slow`` markers. This repo registers no
        # ``slow`` marker, and from pytest 9.2.0 an unregistered marker in
        # a ``-m`` expression is a usage error under ``--strict-markers``
        # (exit 4): ``-m "slow or integration"`` failed every leg of every
        # nightly run from 2026-10-28.
        run: |
          mkdir -p reports/junit
          python -m pytest \
            -m integration \
            --tb=short \
            --maxfail=10 \
            --junitxml=reports/junit/junit-slow.xml

      - name: Upload Test Results
        id: upload-test-results
        continue-on-error: ${{ matrix.experimental == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: scheduled-test-results-${{ matrix.python-version }}
          path: reports/junit/
          retention-days: 30

      - name: Report the informational Python 3.15 result
        # Python 3.15 is INFORMATIONAL (phase 1 of the 3.15 migration). On the 3.15 leg every step above
        # carries `continue-on-error: ${{ matrix.experimental == true }}`, so a failing step neither stops
        # this job nor turns its check red, and no merge, push or deployment waits on it. This step says
        # what failed instead: a warning annotation, and a table in the job summary.
        if: always() && matrix.experimental == true
        env:
          STEPS_JSON: ${{ toJSON(steps) }}
          PY_LEG: ${{ matrix.python-version }}
        run: |
          python3 - <<'PY'
          import json, os
          steps = json.loads(os.environ["STEPS_JSON"])
          leg = os.environ["PY_LEG"]
          failed = [k for k, v in steps.items() if v.get("outcome") not in ("success", "skipped")]
          rows = "\n".join(f"| `{k}` | {v.get('outcome')} |" for k, v in steps.items())
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as fh:
              fh.write(f"### Python {leg}: informational, blocks nothing\n\n| Step | Outcome |\n|---|---|\n{rows}\n")
          if failed:
              print(f"::warning title=Python {leg} (informational)::{len(failed)} step(s) failed on Python {leg}: {', '.join(failed)}. Nothing is blocked; see this job's summary.")
          else:
              print(f"::notice title=Python {leg} (informational)::every step passed on Python {leg}")
          PY
