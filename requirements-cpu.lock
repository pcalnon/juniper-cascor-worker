# CPU-only lock for the juniper-cascor-worker CONTAINER IMAGE (Phase 4E, CW-02).
#
# This lock is ``requirements.lock`` MINUS the CUDA stack. It pins everything the worker
# needs EXCEPT torch, which the Dockerfile installs separately from the PyTorch CPU index
# (https://download.pytorch.org/whl/cpu), pinned to the +cpu version named below.
# ``requirements.lock`` cannot serve the image: it was resolved against the CUDA torch on
# PyPI, so it pins nvidia-cublas / nvidia-cudnn-cu13 / nvidia-nccl-cu13 / triton /
# cuda-toolkit and friends OUTRIGHT -- 19 pins, ~3 GB that `pip install -r` installs
# whether or not torch wants them, on an image that is CPU-only by design (plan D-5) and
# must run on Raspberry Pi nodes.
#
# The pins shared with requirements.lock are IDENTICAL by construction
# (``--constraint requirements.lock`` below), so the image and a GPU dev install differ
# only in torch's build and the absence of the nvidia-*/triton wheels.
# tests/test_dockerfile_cpu_torch_pin.py::TestDockerfileTorchPin::test_cpu_lock_is_the_gpu_lock_minus_the_cuda_stack
# asserts that set equality, so regenerating ONE lock without the other fails the build.
#
# Regeneration command (run from the repo root, AFTER requirements.lock is current):
#   echo "torch==2.14.0+cpu" > /tmp/torch-cpu-override
#   uv pip compile pyproject.toml \
#     --index-strategy unsafe-best-match \
#     --extra-index-url https://download.pytorch.org/whl/cpu \
#     --no-emit-package torch \
#     --override /tmp/torch-cpu-override \
#     --constraint requirements.lock \
#     --python-version 3.14 \
#     -o requirements-cpu.lock
#   (then restore this header: uv overwrites it with the command line)
#
# Three flags are load-bearing and were absent before 2026-09-09:
#   * ``--constraint requirements.lock`` -- without it a fresh resolution takes the newest
#     of everything and the two locks silently diverge. They HAD diverged: on 10 of the 19
#     shared pins (setuptools 70.2.0 vs 83.0.0, numpy 2.4.4 vs 2.5.1, websockets 16.0 vs
#     16.1.1, ...), because lockfile-update.yml regenerates requirements.lock alone.
#   * ``--index-strategy unsafe-best-match`` -- uv's default stops at the first index that
#     has a package, and the PyTorch CPU index carries its own (older) setuptools. Under
#     the constraint that produces an unsatisfiable resolution rather than a wrong pin.
#   * ``--python-version 3.14`` -- the image is python:3.14-slim. Without it the lock is
#     resolved for whatever interpreter ran uv.
#
# The torch pin here MUST equal ``ARG TORCH_VERSION`` in the Dockerfile -- the same test
# module fails otherwise. Bump both together, and re-run the command above so torch's own
# transitive pins (setuptools, sympy, networkx, ...) move with it. The +cpu local-version
# segment is what makes uv resolve against the CPU wheel, whose metadata declares no
# nvidia-* dependencies at all.
#
# Companion lock with the full NVIDIA stack: ``requirements.lock`` (preserved as the
# legacy default for dev/laptop GPU installs).
